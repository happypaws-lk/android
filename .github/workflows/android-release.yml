name: Android Release Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.0)'
        required: false
        default: ''
      skip_health_check:
        description: 'Skip API health check'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Verify Lightsail API Health
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_health_check }}
    steps:
      - name: Test Lightsail API Health
        env:
          API_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning ::API_BASE_URL secret is not set. Skipping live health check."
            exit 0
          fi

          # Strip trailing slash if present
          CLEAN_URL="${API_URL%/}"
          echo "Testing health check against $CLEAN_URL..."

          # Attempt /health then /healthz
          HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 15 "$CLEAN_URL/health" || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "/health returned $HTTP_STATUS, trying /healthz..."
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --max-time 15 "$CLEAN_URL/healthz" || echo "000")
          fi

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "API Health Check PASSED (HTTP 200)"
          else
            echo "::error ::API Health Check FAILED. Endpoint returned HTTP status $HTTP_STATUS at $CLEAN_URL"
            exit 1
          fi

  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    needs: [health-check]
    if: |
      always() &&
      (needs.health-check.result == 'success' || needs.health-check.result == 'skipped')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Determine Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG#v}"
          elif [ -n "${{ inputs.version_name }}" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            TAG="v${VERSION_NAME}"
          else
            VERSION_NAME="1.0.${{ github.run_number }}"
            TAG="v${VERSION_NAME}"
          fi

          VERSION_CODE="${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building version $VERSION_NAME (Code: $VERSION_CODE, Tag: $TAG)"

      - name: Decode Signing Keystore
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore/release.keystore
            echo "keystore_path=keystore/release.keystore" >> $GITHUB_OUTPUT
            echo "Keystore decoded successfully."
          else
            echo "::warning ::KEYSTORE_BASE64 secret not found. Building without custom release keystore."
            echo "keystore_path=" >> $GITHUB_OUTPUT
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Assemble Release APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          GRADLE_ARGS="-PversionName=${{ steps.versioning.outputs.VERSION_NAME }} -PversionCode=${{ steps.versioning.outputs.VERSION_CODE }}"

          if [ -n "${{ steps.decode_keystore.outputs.keystore_path }}" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PKEYSTORE_FILE=${{ steps.decode_keystore.outputs.keystore_path }} -PKEYSTORE_PASSWORD=$KEYSTORE_PASSWORD -PKEY_ALIAS=$KEY_ALIAS -PKEY_PASSWORD=$KEY_PASSWORD"
          fi

          if [ -n "$API_BASE_URL" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PAPI_BASE_URL=$API_BASE_URL"
          fi

          ./gradlew assembleRelease $GRADLE_ARGS --stacktrace

      - name: Prepare Release APK Asset
        id: prepare_asset
        run: |
          APK_DIR="app/build/outputs/apk/release"
          APK_FILE=$(find "$APK_DIR" -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error ::Release APK not found in $APK_DIR"
            exit 1
          fi

          DEST_NAME="HappyPaws-${{ steps.versioning.outputs.TAG }}.apk"
          cp "$APK_FILE" "$DEST_NAME"
          echo "apk_path=$DEST_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release artifact: $DEST_NAME"

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG }}
          name: HappyPaws ${{ steps.versioning.outputs.TAG }}
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
